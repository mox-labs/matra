[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "matra"
version = "0.2.0"
description = "NLP library: UDPipe structured parse, base text metrics, summarization, keyphrase extraction."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "yzavyas" }]
requires-python = ">=3.12"
# No runtime dependencies. The command line is the Rust binary reached
# through the extension module, the way ruff and uv ship theirs.
dependencies = []

[project.optional-dependencies]
typecheck = [
    "mypy>=1.10",
]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]
lint = [
    "ruff>=0.6",
]
dev = [
    "matra[typecheck,test,lint]",
]

[project.scripts]
matra = "matra.cli:main"

[tool.maturin]
features = ["python", "udpipe", "model2vec"]
python-source = "python"
module-name = "matra._core"
include = [
    { path = "python/matra/py.typed", format = "wheel" },
    { path = "python/matra/_core.pyi", format = "wheel" },
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["python/matra"]
# The PyO3 extension is described by a stub file; mypy resolves it via
# the package's own py.typed marker.
mypy_path = "python"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RUF"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["python/tests"]
# Conformance tests need the UDPipe model. Deselect them where it is absent:
#   uv run pytest -m "not model"
markers = [
    "model: requires a model in the resolved directory (UDPipe and potion-base-8M, each downloaded from a pinned, digest-verified artifact on first use)",
]
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["python/matra"]
branch = true
omit = ["*/_core.pyi"]

[tool.coverage.report]
# The PyO3 extension is Rust; its coverage is measured by cargo-llvm-cov.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
show_missing = true
skip_covered = true
