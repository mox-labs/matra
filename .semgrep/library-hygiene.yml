# Library conventions from CLAUDE.md that a check can read. Not one of the
# eight boundary rules; the library's error contract.
#
# src/cli/ and src/bin/ are the application tier, where erasing an error to a
# string is ordinary; test modules are exempt. How the regexes are built is
# explained at the top of rule1-domain.yml.
rules:
  - id: library-no-string-errors
    languages: [regex]
    severity: ERROR
    paths:
      include: ["/src/**/*.rs"]
      exclude: ["/src/cli/**", "/src/bin/**"]
    message: >-
      Library convention (no stringly-typed errors): this is a Result whose
      error type is String or &str, in library code. Why: library callers
      match on concrete domain::Error variants, in Rust and, through the
      exhaustive PyErr mapping, in Python; a string can only be printed, and
      the variant a caller would have matched on is lost. Fix: return
      domain::Result<T> and add or reuse a domain::Error variant (a new
      variant must also be routed in the From<MatraError> for PyErr match).
      Erasing to a string is fine in src/cli/, which is the application.
      Read: CLAUDE.md, sections "Things that will bite you" and "Conventions".
    patterns:
      - pattern-regex: '(?m)^(?![ \t]*//)[^\n]*?\K\bResult\s*<(?:[^<>;{}()]|<(?:[^<>;{}]|<[^<>;{}]*>)*>|\((?:[^()]|\([^()]*\))*\))*,\s*(?:(?:std|alloc)\s*::\s*string\s*::\s*)?(?:String|&\s*(?:''\w+\s+)?str)\s*>'
      - pattern-not-regex: '#\[cfg\(test\)\](?:\s*#\[[^\]]*\])*\s*(?:pub(?:\s*\([^)]*\))?\s+)?mod\s+\w+\s*(\{(?:[^{}"''/r]++|r(#*)"[\s\S]*?"\2|r|"(?:[^"\\]|\\[\s\S])*+"|''(?:[^''\\]|\\[\s\S])''|''|//[^\n]*+|/|(?1))*+\})'

  - id: library-no-unwrap
    languages: [regex]
    severity: ERROR
    paths:
      include: ["/src/**/*.rs"]
      exclude: ["/src/cli/**", "/src/bin/**"]
    message: >-
      Library convention (no panics in library code): this is `.unwrap()` or
      `.expect(...)` in library code, outside a test module. Why: a panic in
      the library is a crash in the caller's process, and through the Python
      binding an uncaught one ends the interpreter; the library's failures
      are domain::Error values the caller can match on. Fix: propagate with
      `?` into a domain::Error variant, or, where the value provably cannot
      be absent, restructure so the type says so. Tests may unwrap. Read:
      CLAUDE.md, section "Conventions".
    patterns:
      - pattern-regex: '(?m)^(?![ \t]*//)[^\n]*?\K\.\s*(?:unwrap|expect)\s*\('
      - pattern-not-regex: '#\[cfg\(test\)\](?:\s*#\[[^\]]*\])*\s*(?:pub(?:\s*\([^)]*\))?\s+)?mod\s+\w+\s*(\{(?:[^{}"''/r]++|r(#*)"[\s\S]*?"\2|r|"(?:[^"\\]|\\[\s\S])*+"|''(?:[^''\\]|\\[\s\S])''|''|//[^\n]*+|/|(?1))*+\})'
