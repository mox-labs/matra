[book]
title = "vaani"
description = "NLP library: UDPipe structured parse, base text metrics, summarization, keyphrase extraction"
authors = ["yzavyas"]
language = "en"
src = "src"

[rust]
edition = "2024"

[output.html]
default-theme = "ayu"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/mox-labs/vaani"
edit-url-template = "https://github.com/mox-labs/vaani/edit/main/book/{path}"
site-url = "/"
cname = ""
no-section-label = false
fold = { enable = true, level = 1 }
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.playground]
editable = false
copy-js = true
line-numbers = false
runnable = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

# linkcheck deferred: mdbook-linkcheck 0.7.7 is incompatible with mdbook 0.5.3
# (RenderContext schema drift). Phase 0 floor uses lychee for link verification;
# CI script in scripts/check-docsite-floor.sh handles it.
