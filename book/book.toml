[book]
title = "matra"
description = "NLP library: UDPipe structured parse, base text metrics, summarization, keyphrase extraction"
authors = ["yzavyas"]
language = "en"
src = "src"

[build]
# When mdbook serve / build encounters a SUMMARY.md entry whose source file
# does not exist, fail loudly instead of silently creating an empty stub.
# Empty stubs from `create-missing = true` race the file moves during
# IA restructures and re-spawn orphans in old directories. Setting this to
# false makes the floor gate the authoritative source of truth.
create-missing = false

[rust]
edition = "2024"

[output.html]
default-theme = "ayu"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/mox-labs/matra"
edit-url-template = "https://github.com/mox-labs/matra/edit/main/book/{path}"
site-url = "/"
cname = ""
no-section-label = false
fold = { enable = true, level = 1 }
additional-css = ["css/matra.css"]

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.playground]
editable = false
copy-js = true
line-numbers = false
runnable = false

# Mermaid is not installed. Every figure in this book is hand-authored inline
# SVG, because in all of them the meaning depends on where something sits:
# word order in the dependency tree, containment in the type graph, arrows that
# stop at the FFI wall while others cross it. Mermaid gives nodes, edges and
# labels but not position, so its auto-layout would contradict the data while
# looking authoritative.
#
# Mermaid remains the right tool for sequences, state machines and decision
# trees. When one of those is needed, restore it with:
#
#     mdbook-mermaid install book
#
# which re-vendors mermaid.min.js and mermaid-init.js and re-adds the
# additional-js and [preprocessor.mermaid] entries this comment replaces.
# The rule for choosing between them is in .rhet/voice.md feature 8.

