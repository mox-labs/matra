[models]
# Model directory defaults to $XDG_DATA_HOME/matra/models (~/.local/share/matra/models).
# Override with MATRA_MODEL_DIR, or MATRA_DATA_DIR for the whole data root.
embedding = "potion-base-8M"

[summary]
n = 3
method = "tfidf"

[keyphrases]
n = 10
method = "rake"

[clusters]
threshold = 0.85
