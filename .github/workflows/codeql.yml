name: CodeQL

# GitHub's static analysis for security issues. Custom workflow (vs. the
# "default setup" UI option) lets us pin the action to a SHA and integrate
# with Scorecard.
#
# IMPORTANT: before this workflow can run, the repo's CodeQL "default setup"
# must be disabled in Settings -> Code security -> Code scanning. Otherwise
# GitHub rejects the custom workflow with "default setup is already
# enabled". See blueprints/legacy/rfcs/0005-supply-chain-hardening.md.

on:
  push:
    branches: [main, alpha]
  pull_request:
    branches: [main, alpha]
  schedule:
    - cron: "12 3 * * 2"   # Tuesdays 03:12 UTC

permissions: read-all

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        with:
          category: "/language:${{ matrix.language }}"
