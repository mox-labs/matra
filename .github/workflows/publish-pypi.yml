name: Publish to PyPI

# Tag-driven, mirroring publish.yml (crates.io). Mechanical gates:
# tag must match pyproject.toml version, the commit must be on main,
# and the Python test suite must pass against a freshly built wheel
# before anything uploads.
#
# Trusted Publishing (OIDC): no PyPI token is stored anywhere. PyPI
# supports *pending* publishers, so unlike crates.io this works for the
# very first release with no bootstrap token.
#
# MANUAL PREREQUISITE (one-time, in the PyPI UI):
#   pypi.org -> account -> Publishing -> Add pending publisher:
#     - Project name: matra
#     - Owner: mox-labs   Repository: matra
#     - Workflow filename: publish-pypi.yml
#     - Environment: pypi
#
# The wheel matrix and the abi3 choice are ADR-0014. Four wheels cover
# the published surface: Linux x86_64, Linux aarch64, macOS x86_64,
# macOS arm64, each one abi3 so a single wheel serves CPython 3.12 and
# every later GIL-enabled 3.x. Free-threaded builds take a different
# ABI tag
# and fall to the sdist until the free-threaded stable ABI lands in 3.15.
#
# Windows wheels are deliberately absent: the UDPipe C++ build under
# MSVC is unverified. Add the target when it is.
#
# pypa/gh-action-pypi-publish is the one third-party action here; pypa
# is a verified creator, which the org policy admits, and the ref is a
# commit SHA, which the policy requires.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0). Use this only to retry a failed publish."
        required: true
        type: string

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PUBLISH_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Tag matches pyproject.toml and sits on main
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ env.PUBLISH_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify
        env:
          TAG_REF: ${{ env.PUBLISH_TAG }}
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG_REF#v}"
          PY_VERSION="$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -n1)"
          if [[ "$TAG_VERSION" != "$PY_VERSION" ]]; then
            echo "::error::tag version ($TAG_VERSION) != pyproject.toml version ($PY_VERSION)"
            exit 1
          fi
          git fetch --no-tags origin main
          # HEAD, not GITHUB_SHA. The checkout above takes the tag, but on a
          # workflow_dispatch GITHUB_SHA is the ref the run was dispatched
          # from, which is main by default. So this asserted that main is an
          # ancestor of main and said nothing about the tag being published.
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" "origin/main"; then
            echo "::error::tag $TAG_REF is not on main; refusing to publish"
            exit 1
          fi

  # No third-party build action: the org Actions policy validates every
  # `uses` ref at workflow start, and keeping the build to `actions/*`
  # plus shell removes that variable. The Linux half is built inside
  # ghcr.io/pyo3/maturin instead, which is the same manylinux2014 base
  # PyO3/maturin-action would have used, reached with plain `docker run`
  # and pinned by index digest the way the policy pins action SHAs.
  #
  # Building on the runner rather than in that image is what produced a
  # manylinux_2_34 wheel for 0.1.x, which pip rejects on Debian 11,
  # Ubuntu 20.04, RHEL 8 and Amazon Linux 2. The container drops the
  # floor to glibc 2.17. See ADR-0014.
  wheels:
    name: Wheel ${{ matrix.platform.name }}
    needs: [verify]
    runs-on: ${{ matrix.platform.runner }}
    # A starved runner must fail loudly rather than squat on the
    # concurrency group and block the next dispatch.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          # ubuntu-24.04-arm is a GitHub-hosted arm64 runner, free for
          # public repositories. It exists so the Linux aarch64 wheel is
          # built natively rather than under QEMU, which would push the
          # job past its timeout.
          #
          # macos-x86_64 cross-compiles from the arm64 runner: GitHub
          # is retiring the Intel macos-13 runners and jobs targeting
          # them starve in the queue. Cross-built wheels cannot smoke
          # test on the arm host, so those steps are native-only.
          - { name: linux-x86_64, runner: ubuntu-latest, manylinux: true, target: "" }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, manylinux: true, target: "" }
          - { name: macos-x86_64, runner: macos-14, manylinux: false, target: x86_64-apple-darwin }
          - { name: macos-aarch64, runner: macos-14, manylinux: false, target: "" }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ env.PUBLISH_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      # RUSTUP_TOOLCHAIN is not optional. rust-toolchain.toml asks for
      # components the image does not carry, so rustup re-syncs the
      # channel inside the container, and the rename it does to swap a
      # component crosses the overlay boundary between the image layer
      # and the container, which fails with "Invalid cross-device link
      # (os error 18)". RUSTUP_TOOLCHAIN sits above rust-toolchain.toml
      # in rustup's override precedence, so this builds on the toolchain
      # the image already ships and never re-syncs at all. Remove it and
      # every Linux wheel fails.
      #
      # The other way out is RUSTUP_PERMIT_COPY_RENAME=1, which rustup
      # documents as unstable, says sacrifices some transaction
      # protections, and says may be removed at any point. ADR-0014
      # records why this branch was taken instead.
      - name: Build wheel in the manylinux container (Linux)
        if: matrix.platform.manylinux
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/io" -w /io \
            -e RUSTUP_TOOLCHAIN=stable \
            -e CARGO_TARGET_DIR=/build-target \
            ghcr.io/pyo3/maturin:v1.14.1@sha256:2665227312dd1eab1c29c70a001dc8aac53155a2d048bede3b2df7f1691c8e38 \
            build --release --out dist
          sudo chown -R "$(id -u):$(id -g)" dist
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9  # master
        if: ${{ !matrix.platform.manylinux }}
        with:
          toolchain: stable
          targets: ${{ matrix.platform.target }}
      - name: Build wheel on the runner (macOS)
        if: ${{ !matrix.platform.manylinux }}
        env:
          BUILD_TARGET: ${{ matrix.platform.target }}
        run: |
          set -euo pipefail
          python -m pip install maturin==1.14.1
          if [ -n "$BUILD_TARGET" ]; then
            maturin build --release --out dist --target "$BUILD_TARGET"
          else
            maturin build --release --out dist
          fi
      # The abi3 contract, checked rather than assumed: one wheel per
      # platform, tagged cp312-abi3, and Linux wheels no higher than the
      # manylinux2014 floor. A dropped `abi3-py312` feature or a build
      # that escaped the container fails here, not on a user's machine.
      - name: The wheel is abi3, and Linux wheels are manylinux2014
        shell: bash
        run: |
          set -euo pipefail
          count=$(find dist -maxdepth 1 -name '*.whl' | wc -l | tr -d ' ')
          [ "$count" = "1" ] || { echo "::error::expected 1 wheel, got $count"; exit 1; }
          name=$(basename dist/*.whl)
          echo "built $name"
          case "$name" in
            *-cp312-abi3-*) ;;
            *) echo "::error::$name is not an abi3 wheel"; exit 1 ;;
          esac
          if [ "${{ matrix.platform.manylinux }}" = "true" ]; then
            case "$name" in
              *manylinux2014_*) ;;
              *) echo "::error::$name is not manylinux2014"; exit 1 ;;
            esac
          fi
      # Native builds only: a cross-built wheel cannot run on the host.
      # The interpreter here is deliberately newer than the one the
      # wheel was built against, so this proves the abi3 wheel installs
      # without a source build on a later CPython. --only-binary :all:
      # makes pip fail rather than quietly fall back to building.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        if: matrix.platform.target == ''
        with:
          python-version: "3.13"
      - name: Smoke test on a newer CPython than the wheel was built for
        if: matrix.platform.target == ''
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke
          # The package has no runtime dependencies, so --find-links
          # plus --no-index is enough on its own.
          /tmp/smoke/bin/pip install --no-index --only-binary :all: --find-links dist matra
          /tmp/smoke/bin/python -c "import sys, matra; assert sys.version_info[:2] == (3, 13), sys.version_info; print(matra.Matra)"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist

  sdist:
    name: Source distribution
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ env.PUBLISH_TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9  # master
        with:
          toolchain: stable
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          set -euo pipefail
          python -m pip install maturin==1.14.1
          maturin sdist --out dist
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish (pypi environment)
    needs: [wheels, sdist]
    environment: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write   # Trusted Publishing OIDC
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      # The pypa publish action is a Docker action whose image is only
      # tagged by release tag, so the org's mandatory commit-SHA pinning
      # breaks its image pull (manifest unknown). The Trusted Publishing
      # exchange is a documented two-request flow, done directly here
      # with no third-party action: GitHub mints an OIDC identity proof,
      # PyPI verifies it against the registered publisher and returns a
      # minutes-lived upload token, twine uploads with it.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Upload via Trusted Publishing (OIDC, no stored secret)
        run: |
          set -euo pipefail
          oidc=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pypi"             | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
          token=$(curl -sSf -X POST https://pypi.org/_/oidc/mint-token             -H "Content-Type: application/json"             -d "{\"token\": \"$oidc\"}"             | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")
          echo "::add-mask::$token"
          python -m pip install twine==6.2.0
          TWINE_USERNAME=__token__ TWINE_PASSWORD="$token"             python -m twine upload --non-interactive dist/*
