name: Publish to PyPI

# Tag-driven, mirroring publish.yml (crates.io). Mechanical gates:
# tag must match pyproject.toml version, the commit must be on main,
# and the Python test suite must pass against a freshly built wheel
# before anything uploads.
#
# Trusted Publishing (OIDC): no PyPI token is stored anywhere. PyPI
# supports *pending* publishers, so unlike crates.io this works for the
# very first release with no bootstrap token.
#
# MANUAL PREREQUISITE (one-time, in the PyPI UI):
#   pypi.org -> account -> Publishing -> Add pending publisher:
#     - Project name: matra
#     - Owner: mox-labs   Repository: matra
#     - Workflow filename: publish-pypi.yml
#     - Environment: pypi
#
# Windows wheels are deliberately absent for 0.1.x: the UDPipe C++
# build under MSVC is unverified. Add the target when it is.
#
# pypa/gh-action-pypi-publish is the one third-party action here; pypa
# is a verified creator, which the org policy admits, and the ref is a
# commit SHA, which the policy requires.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0). Use this only to retry a failed publish."
        required: true
        type: string

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PUBLISH_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Tag matches pyproject.toml and sits on main
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ env.PUBLISH_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify
        env:
          TAG_REF: ${{ env.PUBLISH_TAG }}
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG_REF#v}"
          PY_VERSION="$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -n1)"
          if [[ "$TAG_VERSION" != "$PY_VERSION" ]]; then
            echo "::error::tag version ($TAG_VERSION) != pyproject.toml version ($PY_VERSION)"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "::error::tag $TAG_REF is not on main; refusing to publish"
            exit 1
          fi

  # Wheels build with pip-installed maturin rather than a third-party
  # build action: the org Actions policy validates every `uses` ref at
  # workflow start, and keeping the build to `actions/*` plus shell
  # removes that variable entirely. Cost: linux wheels carry the
  # runner's glibc tag rather than broad manylinux, and no linux
  # aarch64 wheel ships for 0.1.x. Restore PyO3/maturin-action (SHA
  # pinned, org-allowlisted) when broader targets matter.
  wheels:
    name: Wheel ${{ matrix.platform.name }}
    needs: [verify]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-latest }
          - { name: macos-x86_64, runner: macos-13 }
          - { name: macos-aarch64, runner: macos-14 }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ env.PUBLISH_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade maturin
          maturin build --release --out dist
      - name: Smoke test the wheel
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --no-index --find-links dist matra
          /tmp/smoke/bin/python -c "import matra; print(matra.Matra)"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist

  sdist:
    name: Source distribution
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ env.PUBLISH_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          set -euo pipefail
          python -m pip install --upgrade maturin
          maturin sdist --out dist
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish (pypi environment)
    needs: [wheels, sdist]
    environment: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Trusted Publishing OIDC
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26  # v1.14.2
        with:
          packages-dir: dist
