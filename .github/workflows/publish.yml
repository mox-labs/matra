name: Publish to crates.io

# Tag-driven publish workflow. The crates-io environment gate enforces
# the project's non-negotiable per-publish approval rule: this workflow
# pauses at the `publish` job until a required reviewer clicks "Approve"
# in the GitHub Actions UI. Without the click, cargo publish never runs.
#
# Trusted Publishing (OIDC) means no long-lived CARGO_REGISTRY_TOKEN
# is stored in the repo; the token is minted just-in-time by crates.io
# and scoped to this workflow + this crate.
#
# SLSA L3 provenance is generated by the slsa-github-generator reusable
# workflow and attached to the GitHub Release alongside release notes.
# Downstream consumers can verify the published artifact via
# `slsa-verifier verify-artifact vaani-X.Y.Z.crate
#    --provenance-path vaani.intoto.jsonl
#    --source-uri github.com/mox-labs/vaani
#    --source-tag vX.Y.Z`.
#
# Adopted as part of i9/gh-guard-uptake. See
# docs/decisions/0005-supply-chain-hardening.md.
#
# MANUAL PREREQUISITES (one-time, in the GitHub UI):
#   1. Settings -> Environments -> new "crates-io" -> Required reviewers:
#      add yzavyas (or the maintainer set). This is the human-approval gate.
#   2. crates.io/crates/vaani/settings -> Trusted Publishing -> Add:
#        - Repository: mox-labs/vaani
#        - Workflow filename: publish.yml
#        - Environment: crates-io
#      Note: requires one prior cargo publish with a traditional API token
#      to bootstrap (Trusted Publishing cannot create a crate from scratch).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.5). Use this only to retry a failed publish."
        required: true
        type: string

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PUBLISH_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  publish:
    name: Publish (gated by crates-io environment)
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    environment: crates-io   # <-- human-approval gate enforced here
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # for Trusted Publishing OIDC
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ env.PUBLISH_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9  # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2

      - name: Verify tag matches Cargo.toml version and the commit is on main
        env:
          TAG_REF: ${{ env.PUBLISH_TAG }}
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG_REF#v}"
          CRATE_VERSION="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n1)"
          if [[ "$TAG_VERSION" != "$CRATE_VERSION" ]]; then
            echo "::error::tag version ($TAG_VERSION) != Cargo.toml version ($CRATE_VERSION)"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "::error::tag $TAG_REF is not on main; refusing to publish"
            exit 1
          fi
          echo "Publishing $TAG_REF (Cargo.toml says $CRATE_VERSION) from a main-reachable commit"

      - name: cargo test (no-default-features)
        run: cargo test --locked --no-default-features

      - name: cargo test (default features)
        run: cargo test --locked

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe  # v2
        with:
          command: check
          arguments: --all-features

      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked

      - name: cargo package (build the .crate artifact)
        run: cargo package --locked

      - name: Compute SLSA-compatible digest of the published artifact
        id: hash
        run: |
          set -euo pipefail
          cd target/package
          HASHES="$(sha256sum vaani-*.crate | base64 -w0)"
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"

      - name: Mint a crates.io scoped token via Trusted Publishing (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  provenance:
    name: SLSA L3 provenance
    needs: [publish]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.publish.outputs.hashes }}
      upload-assets: false   # we attach to the GitHub Release in the next job
      provenance-name: vaani.intoto.jsonl

  release:
    name: Create GitHub Release with provenance
    needs: [publish, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ env.PUBLISH_TAG }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: vaani.intoto.jsonl
          path: provenance/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ env.PUBLISH_TAG }}
        run: |
          gh release create "$TAG_NAME" \
            provenance/vaani.intoto.jsonl \
            --title "$TAG_NAME" \
            --generate-notes \
            --verify-tag
