name: Release

# One release path for both registries. This file replaces publish.yml
# (crates.io) and publish-pypi.yml (PyPI), which were two tag-triggered
# workflows racing on the same tag and re-deriving the same version
# checks in two places, where they had already drifted apart.
#
# The order is deliberate: verify, tag, build, attest, publish, release,
# then prove the registries serve what we built. Nothing is published
# that was not first verified and attested, and nothing is attested that
# was not built here.
#
# WHY DISPATCH AND NOT A TAG PUSH
#
# A release is started by hand from `main`, not by pushing a tag. The
# `crates-io` environment's deployment policy is branch-based, so a
# tag-triggered run failed before it ran a single step on the 0.2.0
# release:
#
#   Tag "v0.2.0" is not allowed to deploy to crates-io due to
#   environment protection rules.
#
# A dispatch from `main` satisfies a branch policy. The workflow creates
# the tag itself, after the checks pass. A tag trigger can come back if
# a release-PR tool ever needs one; it would need a `v*` tag deployment
# policy on both environments to work at all.
#
# MANUAL PREREQUISITES (one-time, outside this file, in three UIs)
#
#   1. GitHub, Settings -> Environments -> `crates-io`:
#        - Required reviewers: the maintainer set. This is the
#          per-publish approval gate for crates.io. Without it the
#          workflow publishes unattended.
#        - Deployment branches: allow `main`. If a tag trigger is ever
#          restored, add a `v*` tag policy as well; a branch policy
#          alone rejects a tag ref outright, which is the 0.2.0 failure
#          above.
#   2. GitHub, Settings -> Environments -> `pypi`: the same two
#      settings. As of the 0.2.0 release this environment carried no
#      protection rules at all, so PyPI published with no human in the
#      loop while crates.io waited for a click. Both registries are
#      irreversible; both get a reviewer.
#   3. crates.io/crates/matra/settings -> Trusted Publishing, and
#      pypi.org -> matra -> Publishing: both bind the OIDC subject to a
#      workflow FILENAME. Both must now name `release.yml`. Until they
#      do, the OIDC exchange fails and nothing publishes. Environment
#      names (`crates-io`, `pypi`) are unchanged.
#
# Action refs are 40-character commit SHAs with a version comment, per
# RFC-0005. The wheel matrix, the manylinux container and the abi3
# contract are RFC-0014.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.2.1). Must equal the version in Cargo.toml on main."
        required: true
        type: string
      skip_tag:
        description: "Retry against the tag that already exists instead of creating it. Use only to re-run a failed publish."
        required: false
        default: false
        type: boolean

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_TAG: v${{ inputs.version }}
  # A first run builds the dispatched commit. A retry builds the tag that
  # already exists, because `main` may have moved since, and a retry must
  # ship what the tag names rather than whatever is newest.
  RELEASE_REF: ${{ inputs.skip_tag && format('v{0}', inputs.version) || github.sha }}

jobs:
  verify:
    name: Verify the release is releasable
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Releases come from main. This is a failure and not an `if`
      # guard, because a skipped job reports green and a release that
      # quietly did nothing is worse than one that stopped loudly.
      - name: The dispatch ref is main
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::release dispatched from $GITHUB_REF; releases come from main"
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9  # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5  # v2

      # The typed version is a confirmation, not a parameter. Everything
      # downstream reads Cargo.toml; this asserts the human meant the
      # version that is actually there, so a mistyped dispatch stops
      # before anything is built, tagged or published.
      - name: The typed version is the version in Cargo.toml
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::version '$VERSION' is not a bare semver (no leading v, for example 0.2.1)"
            exit 1
          fi
          CRATE_VERSION="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n1)"
          if [ "$VERSION" != "$CRATE_VERSION" ]; then
            echo "::error::dispatched version ($VERSION) != Cargo.toml version ($CRATE_VERSION). Land the bump on main first, or dispatch $CRATE_VERSION."
            exit 1
          fi
          echo "releasing $VERSION (Cargo.toml agrees)"

      # Cargo.toml is the canonical version; four other files carry it
      # too, and CITATION.cff carries the release date. One script owns
      # that comparison (RFC-0013), so this workflow calls it rather than
      # re-deriving a subset of it the way the two old workflows did.
      - name: Every version-carrying file agrees
        run: bash scripts/check-version-sync.sh

      - name: The CHANGELOG has a section for this version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section. Run scripts/changelog-release.sh first."
            exit 1
          fi

      - name: The commit being released is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          # HEAD, not GITHUB_SHA. The checkout above takes RELEASE_REF,
          # which on a retry is the tag, while GITHUB_SHA is the ref the
          # run was dispatched from, which is main. Asserting that would
          # have said nothing about what is being published. Both old
          # workflows carried this bug before it was fixed in each.
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" "origin/main"; then
            echo "::error::$(git rev-parse HEAD) is not on main; refusing to publish"
            exit 1
          fi

      # The provenance names GITHUB_SHA as the source, whatever was built.
      # attest-build-provenance records the dispatch commit, and on a
      # retry the build jobs check out the tag instead. The 0.2.1 retry
      # shipped that mismatch: its provenance says 311ade8 (main at
      # dispatch) while the crate's .cargo_vcs_info.json says e30a882 (the
      # tag). It was harmless only because the two differed in .github/
      # alone. That is now the rule rather than luck: a retry proceeds
      # only when the commit the provenance names would build the same
      # release contents as the commit that is actually built. On a first
      # run HEAD is GITHUB_SHA and this passes trivially.
      - name: The provenance commit builds what the tag builds
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          head="$(git rev-parse HEAD)"
          if ! git diff --quiet "$head" "$GITHUB_SHA" -- . ':(exclude).github'; then
            echo "::error::$RELEASE_REF ($head) and the dispatch commit $GITHUB_SHA differ outside .github/. The attestation would name $GITHUB_SHA as the source of artifacts built from $head. Retry from a main whose only changes since the tag are under .github/, or release a new version."
            git diff --stat "$head" "$GITHUB_SHA" -- . ':(exclude).github'
            exit 1
          fi
          echo "$head and $GITHUB_SHA agree outside .github/"

      - name: cargo test (no-default-features)
        run: cargo test --locked --no-default-features

      - name: cargo test (default features)
        run: cargo test --locked

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3fd3802e88374d3fe9159b834c7714ec57d6c979  # v2
        with:
          command: check
          arguments: --all-features

      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked

  # The tag is created here rather than pushed from a laptop, so what
  # gets published and what the tag names cannot diverge: the tag is made
  # from the commit this run just verified. The API creates a tag OBJECT
  # and then the ref, which is what makes it annotated; a ref pointing
  # straight at a commit is a lightweight tag and carries no message,
  # tagger or date.
  #
  # If tag protection rules are ever added for `v*`, GITHUB_TOKEN has to
  # be allowed to create them or this job fails with 403.
  tag:
    name: Tag v${{ inputs.version }}
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create the annotated tag, or confirm the retry target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_TAG: ${{ inputs.skip_tag }}
        run: |
          set -euo pipefail
          # Exit status, not output. Two ways to get this wrong, both of
          # which failed a 0.2.1 dispatch on a tag that did not exist:
          # `gh api --jq '.object.sha' || true` prints the literal `null` on a
          # 404 because gh writes the error body to stdout, so an emptiness
          # test reads a missing tag as an existing one; and `git ls-remote
          # origin` cannot work here because this job never checks out, so it
          # has no remote. `--silent` discards the body and leaves the status.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --silent >/dev/null 2>&1; then
            existing=yes
          else
            existing=
          fi
          if [ "$SKIP_TAG" = "true" ]; then
            if [ -z "$existing" ]; then
              echo "::error::skip_tag was set but $RELEASE_TAG does not exist. Dispatch without skip_tag to create it."
              exit 1
            fi
            echo "retrying against the existing $RELEASE_TAG"
          else
            if [ -n "$existing" ]; then
              echo "::error::$RELEASE_TAG already exists. Release a new version, or re-dispatch with skip_tag=true to retry the publish against this tag."
              exit 1
            fi
            obj="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$RELEASE_TAG" \
              -f message="$RELEASE_TAG" \
              -f object="$GITHUB_SHA" \
              -f type=commit --jq '.sha')"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$obj" > /dev/null
            echo "created $RELEASE_TAG at $GITHUB_SHA"
          fi

      # Annotated is asserted; signed is reported. Today's tags are
      # unsigned, and a tag created through the API cannot carry the
      # maintainer's signature. Requiring one is a separate decision
      # (RFC-0005 item 8), so this prints the state rather than failing.
      - name: The tag is annotated, and say whether it is signed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          kind="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type')"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [ "$kind" != "tag" ]; then
            echo "::error::$RELEASE_TAG is a lightweight tag (it points straight at a $kind). Release tags are annotated."
            exit 1
          fi
          verified="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.verification.verified')"
          if [ "$verified" = "true" ]; then
            echo "$RELEASE_TAG is annotated and signed"
          else
            echo "::notice::$RELEASE_TAG is annotated and NOT signed. Signed release tags are RFC-0005 item 8, not yet in force."
          fi

  build-crate:
    name: Build the .crate
    needs: [verify, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9  # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5  # v2
      - name: cargo package
        run: cargo package --locked
      - name: The packaged crate is the version being released
        run: |
          set -euo pipefail
          count=$(find target/package -maxdepth 1 -name '*.crate' | wc -l | tr -d ' ')
          [ "$count" = "1" ] || { echo "::error::expected 1 .crate, got $count"; exit 1; }
          name=$(basename target/package/*.crate)
          [ "$name" = "matra-$RELEASE_VERSION.crate" ] || {
            echo "::error::packaged $name, expected matra-$RELEASE_VERSION.crate"; exit 1; }
          sha256sum "target/package/$name"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: crate
          path: target/package/*.crate

  # No third-party build action: the org Actions policy validates every
  # `uses` ref at workflow start, and keeping the build to `actions/*`
  # plus shell removes that variable. The Linux half is built inside
  # ghcr.io/pyo3/maturin instead, which is the same manylinux2014 base
  # PyO3/maturin-action would have used, reached with plain `docker run`
  # and pinned by index digest the way the policy pins action SHAs.
  #
  # Building on the runner rather than in that image is what produced a
  # manylinux_2_34 wheel for 0.1.x, which pip rejects on Debian 11,
  # Ubuntu 20.04, RHEL 8 and Amazon Linux 2. The container drops the
  # floor to glibc 2.17. See RFC-0014.
  #
  # Nothing watches the image digest: dependabot covers cargo, actions
  # and pip, and cannot see a digest written inline in a `run:` step.
  # Bumping it is a person's job, on the release checklist.
  build-wheels:
    name: Wheel ${{ matrix.platform.name }}
    needs: [verify, tag]
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    # A starved runner must fail loudly rather than squat on the
    # concurrency group and block the next dispatch.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          # ubuntu-24.04-arm is a GitHub-hosted arm64 runner, free for
          # public repositories. It exists so the Linux aarch64 wheel is
          # built natively rather than under QEMU, which would push the
          # job past its timeout.
          #
          # macos-x86_64 cross-compiles from the arm64 runner: GitHub
          # is retiring the Intel macos-13 runners and jobs targeting
          # them starve in the queue. Cross-built wheels cannot smoke
          # test on the arm host, so those steps are native-only.
          - { name: linux-x86_64, runner: ubuntu-latest, manylinux: true, target: "" }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, manylinux: true, target: "" }
          - { name: macos-x86_64, runner: macos-14, manylinux: false, target: x86_64-apple-darwin }
          - { name: macos-aarch64, runner: macos-14, manylinux: false, target: "" }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      # RUSTUP_TOOLCHAIN is not optional. rust-toolchain.toml asks for
      # a component the image does not carry, so rustup re-syncs the
      # channel inside the container, and the rename it does to swap a
      # component crosses the overlay boundary between the image layer
      # and the container, which fails with "Invalid cross-device link
      # (os error 18)". RUSTUP_TOOLCHAIN sits above rust-toolchain.toml
      # in rustup's override precedence, so this builds on the toolchain
      # the image already ships and never re-syncs at all. Remove it and
      # every Linux wheel fails.
      #
      # The other way out is RUSTUP_PERMIT_COPY_RENAME=1, which rustup
      # documents as unstable, says sacrifices some transaction
      # protections, and says may be removed at any point. RFC-0014
      # records why this branch was taken instead.
      - name: Build wheel in the manylinux container (Linux)
        if: matrix.platform.manylinux
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/io" -w /io \
            -e RUSTUP_TOOLCHAIN=stable \
            -e CARGO_TARGET_DIR=/build-target \
            ghcr.io/pyo3/maturin:v1.14.1@sha256:2665227312dd1eab1c29c70a001dc8aac53155a2d048bede3b2df7f1691c8e38 \
            build --release --out dist
          sudo chown -R "$(id -u):$(id -g)" dist
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9  # master
        if: ${{ !matrix.platform.manylinux }}
        with:
          toolchain: stable
          targets: ${{ matrix.platform.target }}
      - name: Build wheel on the runner (macOS)
        if: ${{ !matrix.platform.manylinux }}
        env:
          BUILD_TARGET: ${{ matrix.platform.target }}
        run: |
          set -euo pipefail
          python -m pip install maturin==1.14.1
          if [ -n "$BUILD_TARGET" ]; then
            maturin build --release --out dist --target "$BUILD_TARGET"
          else
            maturin build --release --out dist
          fi
      # The abi3 contract, checked rather than assumed: one wheel per
      # platform, tagged cp312-abi3, and Linux wheels no higher than the
      # manylinux2014 floor. A dropped `abi3-py312` feature or a build
      # that escaped the container fails here, not on a user's machine.
      - name: The wheel is abi3, and Linux wheels are manylinux2014
        shell: bash
        run: |
          set -euo pipefail
          count=$(find dist -maxdepth 1 -name '*.whl' | wc -l | tr -d ' ')
          [ "$count" = "1" ] || { echo "::error::expected 1 wheel, got $count"; exit 1; }
          name=$(basename dist/*.whl)
          echo "built $name"
          case "$name" in
            *-cp312-abi3-*) ;;
            *) echo "::error::$name is not an abi3 wheel"; exit 1 ;;
          esac
          if [ "${{ matrix.platform.manylinux }}" = "true" ]; then
            case "$name" in
              *manylinux2014_*) ;;
              *) echo "::error::$name is not manylinux2014"; exit 1 ;;
            esac
          fi
      # Native builds only: a cross-built wheel cannot run on the host.
      # The interpreter here is deliberately newer than the one the
      # wheel was built against, so this proves the abi3 wheel installs
      # without a source build on a later CPython. --only-binary :all:
      # makes pip fail rather than quietly fall back to building.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        if: matrix.platform.target == ''
        with:
          python-version: "3.13"
      - name: Smoke test on a newer CPython than the wheel was built for
        if: matrix.platform.target == ''
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke
          # The package has no runtime dependencies, so --find-links
          # plus --no-index is enough on its own.
          /tmp/smoke/bin/pip install --no-index --only-binary :all: --find-links dist matra
          /tmp/smoke/bin/python -c "import sys, matra; assert sys.version_info[:2] == (3, 13), sys.version_info; print(matra.Matra)"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist

  build-sdist:
    name: Source distribution
    needs: [verify, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9  # master
        with:
          toolchain: stable
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          set -euo pipefail
          python -m pip install maturin==1.14.1
          maturin sdist --out dist
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: wheels-sdist
          path: dist

  # Provenance over the exact artifacts that will be published, before
  # they are published. The attestation binds each artifact's sha256 to
  # this workflow, this commit and this run, and the publish jobs
  # download those same artifacts rather than rebuilding, so what a
  # consumer verifies is what a consumer downloaded.
  #
  # This is SLSA Build Level 2, not Level 3. Level 3 needs the build to
  # run in a reusable workflow the verifier can identify
  # (slsa-github-generator), which must be referenced by tag, and the
  # org Actions policy requires SHA-pinned refs. publish.yml carried
  # that note; it is still true, and RFC-0005 tracks the intent.
  #
  # Verify a released artifact with:
  #   gh attestation verify matra-X.Y.Z.crate --repo mox-labs/matra
  attest:
    name: Attest build provenance
    needs: [build-crate, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: crate
          path: crate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Everything that will be published, and nothing else
        run: |
          set -euo pipefail
          ls -l crate dist
          wheels=$(find dist -maxdepth 1 -name '*.whl' | wc -l | tr -d ' ')
          sdists=$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')
          [ "$wheels" = "4" ] || { echo "::error::expected 4 wheels, got $wheels"; exit 1; }
          [ "$sdists" = "1" ] || { echo "::error::expected 1 sdist, got $sdists"; exit 1; }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            crate/*.crate
            dist/*

  publish-crates:
    name: Publish to crates.io (gated by the crates-io environment)
    needs: [attest]
    environment: crates-io   # <-- human-approval gate enforced here
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # for Trusted Publishing OIDC
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9  # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5  # v2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: crate
          # Outside the checkout. Inside it, the downloaded file is an
          # untracked change and `cargo package` refuses a dirty tree,
          # which failed the 0.2.1 publish before it reached crates.io.
          path: ${{ runner.temp }}/attested
      # cargo has no "publish this .crate file" command, so `cargo
      # publish` repackages from source. That leaves a gap between the
      # artifact that was attested and the bytes that reach crates.io,
      # and the gap is closable rather than arguable: `cargo package`
      # normalizes file mtimes, so the same source at the same commit
      # produces a byte-identical tarball. Verified locally by packaging
      # twice with every source file touched in between and getting the
      # same sha256. If this ever fails, the two jobs disagree about
      # something (cargo version, features, a generated file) and the
      # attestation would not describe what shipped.
      - name: What ships is what was attested
        run: |
          set -euo pipefail
          cargo package --locked
          built="target/package/matra-$RELEASE_VERSION.crate"
          attested="$RUNNER_TEMP/attested/matra-$RELEASE_VERSION.crate"
          a=$(sha256sum "$built" | cut -d' ' -f1)
          b=$(sha256sum "$attested" | cut -d' ' -f1)
          echo "packaged here: $a"
          echo "attested:      $b"
          [ "$a" = "$b" ] || {
            echo "::error::the crate packaged in this job differs from the attested artifact"; exit 1; }
      - name: Mint a crates.io scoped token via Trusted Publishing (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@b7e9a28eded4986ec6b1fa40eeee8f8f165559ec  # v1
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  publish-pypi:
    name: Publish to PyPI (gated by the pypi environment)
    needs: [attest]
    environment: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write   # Trusted Publishing OIDC, and PEP 740 attestations
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      # dist holds the five artifacts this run built and nothing else.
      # The upload takes a directory, so an extra file in it is an extra
      # file on PyPI, and a missing one is a platform that falls to a
      # source build for the life of the release.
      - name: dist is exactly the five artifacts of this version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ls -l dist
          total=$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')
          [ "$total" = "5" ] || { echo "::error::expected 5 files in dist, got $total"; exit 1; }
          for f in dist/*; do
            case "$(basename "$f")" in
              matra-"$VERSION"-*.whl|matra-"$VERSION".tar.gz) ;;
              *) echo "::error::$(basename "$f") is not an artifact of $VERSION"; exit 1 ;;
            esac
          done
      # The old workflow did the Trusted Publishing exchange by hand with
      # curl and twine, because this action was a Docker action whose
      # image was tagged by release tag and the org's mandatory SHA pin
      # broke the image pull. It is a composite action from v1.12.0
      # onward (checked in action.yml at both SHAs), so the pin works
      # now, and the action emits PEP 740 attestations under Trusted
      # Publishing, which twine did not. That was what the hand-rolled
      # exchange cost.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist
          # A skip_tag retry rebuilds and re-reaches this step after PyPI
          # already holds the version (0.2.1 published to PyPI while
          # crates.io failed). Skipping files that exist keeps a retry of
          # one registry from failing on the other. A first run cannot hit
          # this: the tag job refuses a version whose tag exists.
          skip-existing: true
          attestations: true
          print-hash: true

  github-release:
    name: Create the GitHub Release
    needs: [publish-crates, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: crate
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: artifacts
      # The notes are the CHANGELOG section, not a generated commit
      # list. The changelog is written for a reader; the commit list is
      # written for git.
      - name: Take the notes from the CHANGELOG
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no CHANGELOG body for $VERSION"; exit 1; }
          head -n 5 notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file notes.md \
            --verify-tag \
            artifacts/*

  # The check nobody had. Everything above proves what we built; this
  # proves the registries serve it, from a machine that has never seen
  # this repository. A release that published but is unreachable looks
  # exactly like a good one until a user says otherwise.
  smoke:
    name: Install on ${{ matrix.os }} from the real registries
    needs: [publish-crates, publish-pypi]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      # 3.13 is one minor above the abi3 floor of 3.12, so a wheel that
      # was version-locked rather than abi3 fails here rather than on a
      # user's machine. --only-binary :all: makes pip fail instead of
      # quietly building from the sdist, which would hide exactly that.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9  # master
        with:
          toolchain: stable
      # Both installs retry, because a fresh publish is not visible
      # everywhere at once: PyPI's file storage serves within seconds
      # but the index pip resolves against can trail it, and crates.io
      # writes its sparse index as a step after the registry write.
      # Both are normally current inside a minute. Twelve attempts
      # thirty seconds apart waits six minutes, an order of magnitude
      # past the usual case and well inside this job's timeout, so slow
      # propagation delays the release rather than failing it.
      - name: pip install from PyPI
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/smoke"
          for i in $(seq 1 12); do
            if "$RUNNER_TEMP/smoke/bin/pip" install --only-binary :all: "matra==$RELEASE_VERSION"; then
              break
            fi
            if [ "$i" = "12" ]; then
              echo "::error::matra==$RELEASE_VERSION was not installable from PyPI after 6 minutes"
              exit 1
            fi
            echo "attempt $i failed; PyPI may not have propagated yet, retrying in 30s"
            sleep 30
          done
      - name: The PyPI install runs
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/smoke/bin/matra" --version | tee pypi-version.txt
          grep -q "$RELEASE_VERSION" pypi-version.txt || {
            echo "::error::the PyPI install does not report $RELEASE_VERSION"; exit 1; }
          "$RUNNER_TEMP/smoke/bin/matra" --skill > pypi-skill.txt
          [ -s pypi-skill.txt ] || { echo "::error::matra --skill printed nothing"; exit 1; }
          head -n 3 pypi-skill.txt
      # --root keeps this install off PATH, so the binary under test is
      # unambiguously the one cargo just built and never the wheel's.
      - name: cargo install from crates.io
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if cargo install matra --version "=$RELEASE_VERSION" --features cli --locked --root "$RUNNER_TEMP/cargo-smoke"; then
              break
            fi
            if [ "$i" = "12" ]; then
              echo "::error::matra $RELEASE_VERSION was not installable from crates.io after 6 minutes"
              exit 1
            fi
            echo "attempt $i failed; the crates.io index may not have propagated yet, retrying in 30s"
            sleep 30
          done
      - name: The crates.io install runs
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cargo-smoke/bin/matra" --version | tee cargo-version.txt
          grep -q "$RELEASE_VERSION" cargo-version.txt || {
            echo "::error::the crates.io install does not report $RELEASE_VERSION"; exit 1; }
          "$RUNNER_TEMP/cargo-smoke/bin/matra" --skill > cargo-skill.txt
          [ -s cargo-skill.txt ] || { echo "::error::matra --skill printed nothing"; exit 1; }
          head -n 3 cargo-skill.txt
