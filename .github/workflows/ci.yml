name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Principle of least privilege at the workflow level. Individual jobs
# escalate only what they need via a per-job `permissions:` block.
permissions: read-all

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  rust:
    name: Rust ${{ matrix.os }} / ${{ matrix.features }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - features: default
            flags: ""
          - features: no-default-features
            flags: "--no-default-features"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9  # master (no tagged release; pinned to known-good commit)
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2

      - name: cargo fmt --check
        if: matrix.features == 'default' && matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --all-targets ${{ matrix.flags }}

      - name: cargo clippy
        run: cargo clippy --all-targets ${{ matrix.flags }} -- -D warnings

      - name: cargo test (lib + doc)
        run: cargo test ${{ matrix.flags }}

  msrv:
    name: MSRV (Rust 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9  # master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2
      - name: cargo check (MSRV, all features)
        run: cargo check --all-targets --all-features
      - name: cargo check (MSRV, no default features)
        run: cargo check --all-targets --no-default-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe  # v2
        with:
          command: check
          arguments: --all-features

  semver:
    name: cargo-semver-checks
    runs-on: ubuntu-latest
    # PR-only — we don't gate main on this (the baseline is the published version).
    # `continue-on-error: true` because vaani has not yet been published to
    # crates.io. The action errors with "vaani not found in registry" until
    # there is a published baseline to compare against. Once the first
    # publish happens, drop continue-on-error so PRs that break semver fail.
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9  # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239  # v2.9
        with:
          feature-group: all-features

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9  # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --no-deps --all-features

  python:
    name: Python wheel (${{ matrix.os }} / ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9  # master
        with:
          toolchain: stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2
      - name: Install maturin
        run: pip install maturin
      - name: Build wheel
        run: maturin build --release --out dist
      - name: Install and import
        shell: bash
        run: |
          pip install dist/vaani-*.whl
          python -c "from vaani import Vaani; print('ok')"

  pytype:
    name: Python type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9  # master
        with:
          toolchain: stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2
      - name: Create venv (maturin develop requires VIRTUAL_ENV)
        run: python -m venv .venv
      - name: Install maturin + mypy in venv
        run: |
          . .venv/bin/activate
          pip install maturin "mypy>=1.10" click rich
      - name: Build and install vaani in venv (so the _core stub resolves)
        run: |
          . .venv/bin/activate
          maturin develop --features "python,udpipe"
      - name: mypy
        run: |
          . .venv/bin/activate
          python -m mypy
