name: CI

on:
  push:
    branches: [main, alpha]
  pull_request:
    branches: [main, alpha]

# Principle of least privilege at the workflow level. Individual jobs
# escalate only what they need via a per-job `permissions:` block.
permissions: read-all

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  rust:
    name: Rust ${{ matrix.os }} / ${{ matrix.features }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        features: [default, no-default-features, model2vec, cli]
        include:
          - features: default
            flags: ""
          - features: no-default-features
            flags: "--no-default-features"
          # The command line's own tests, and with them tests/skill.rs,
          # which executes every incantation in skills/matra/ against
          # cli::run (RFC-0012). The `cli` feature is not in the default
          # set, so without this lane none of that compiles in CI. The
          # blocks that need the UDPipe model are `#[ignore]`, so this
          # lane downloads nothing.
          - features: cli
            flags: "--features cli"
          # The adapter's tests, including the cross-target bit-identity
          # assertion, which only means something because this lane runs
          # on both x86_64 (ubuntu) and aarch64 (macos).
          - features: model2vec
            flags: "--no-default-features --features model2vec"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9  # master (no tagged release; pinned to known-good commit)
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5  # v2

      - name: cargo fmt --check
        if: matrix.features == 'default' && matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --all-targets ${{ matrix.flags }}

      - name: cargo clippy
        run: cargo clippy --all-targets ${{ matrix.flags }} -- -D warnings

      - name: cargo test (lib + doc)
        run: cargo test ${{ matrix.flags }}

  msrv:
    name: MSRV (Rust 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9  # master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5  # v2
      - name: cargo check (MSRV, all features)
        run: cargo check --all-targets --all-features
      - name: cargo check (MSRV, no default features)
        run: cargo check --all-targets --no-default-features

  wasm32:
    # The WASM constraint made mechanical (RFC-0010): the core and the
    # model2vec adapter must keep compiling for wasm32-unknown-unknown
    # with no C FFI in the closure.
    name: wasm32 check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9  # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5  # v2
      - name: cargo check (wasm32, core)
        run: cargo check --no-default-features --target wasm32-unknown-unknown
      - name: cargo check (wasm32, model2vec adapter)
        run: cargo check --no-default-features --features model2vec --target wasm32-unknown-unknown

  # The two script gates below used to run only from `just check` and the
  # opt-in pre-commit hook. Each tool is a pinned release asset checked
  # against a pinned SHA-256 before it is unpacked: the ripgrep and lychee
  # digests are the ones their releases publish, the mdbook digest was
  # computed from the asset when this was pinned (mdBook publishes none).
  boundaries:
    name: Boundary check
    runs-on: ubuntu-latest
    env:
      RIPGREP_VERSION: 15.1.0
      RIPGREP_SHA256: 1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Install ripgrep
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          asset="ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl"
          curl -sSLf -o "$RUNNER_TEMP/rg.tar.gz" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${asset}.tar.gz"
          echo "${RIPGREP_SHA256}  $RUNNER_TEMP/rg.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/rg.tar.gz" -C "$HOME/.local/bin" --strip-components=1 "${asset}/rg"
      - name: Boundary rules 3, 4, 8
        run: bash scripts/check-boundaries.sh

  docs-floor:
    name: Docsite floor
    runs-on: ubuntu-latest
    env:
      RIPGREP_VERSION: 15.1.0
      RIPGREP_SHA256: 1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
      # Keep in step with MDBOOK_VERSION in docs.yml, which builds the
      # deployed site with it.
      MDBOOK_VERSION: 0.5.3
      MDBOOK_SHA256: e2fd508a4fac06cbaa9f88b97d27bdc3b55a08946304ca845879fe26a3699e11
      LYCHEE_VERSION: 0.24.2
      LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
      # Gate 1 skips with a warning when lychee is absent, which is right on
      # a laptop and wrong here: this makes a missing lychee a failure.
      LYCHEE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Install ripgrep, mdbook and lychee
        run: |
          set -euo pipefail
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          echo "$bin" >> "$GITHUB_PATH"
          fetch() {
            curl -sSLf -o "$RUNNER_TEMP/$1" "$2"
            echo "$3  $RUNNER_TEMP/$1" | sha256sum -c -
          }
          rg_asset="ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl"
          fetch rg.tar.gz \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${rg_asset}.tar.gz" \
            "$RIPGREP_SHA256"
          tar -xzf "$RUNNER_TEMP/rg.tar.gz" -C "$bin" --strip-components=1 "${rg_asset}/rg"
          fetch mdbook.tar.gz \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            "$MDBOOK_SHA256"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$bin" mdbook
          fetch lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            "$LYCHEE_SHA256"
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$bin" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
      - name: Six docsite gates
        run: bash scripts/check-docsite-floor.sh
      # Every RFC and EP cited anywhere resolves to a record in blueprints/,
      # and every record is in the index. A step here rather than a job of its
      # own, so the set of required check names does not change.
      - name: Blueprint citations
        run: bash scripts/check-blueprint-refs.sh

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3fd3802e88374d3fe9159b834c7714ec57d6c979  # v2
        with:
          command: check
          arguments: --all-features

  semver:
    name: cargo-semver-checks
    runs-on: ubuntu-latest
    # PR-only: the baseline is the published version, so pushes to main
    # (which are merges of already-checked PRs) skip it. Armed since
    # matra 0.1.0 landed on crates.io; a PR that breaks semver now fails.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9  # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5  # v2
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239  # v2.9
        with:
          feature-group: all-features

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9  # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5  # v2
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --no-deps --all-features

  python:
    name: Python wheel (${{ matrix.os }} / ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9  # master
        with:
          toolchain: stable
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5  # v2
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install maturin
        run: uv pip install --system maturin
      - name: Build wheel
        run: maturin build --release --out dist
      # The published wheels are abi3 so one build serves 3.12 and every
      # later GIL-enabled CPython (RFC-0014). Free-threaded builds take a
      # different ABI tag and fall to the sdist. Losing the pyo3
      # `abi3-py312` feature
      # would silently narrow that back to cp312 and send 3.13/3.14
      # users to a source build, so the tag is asserted here on every
      # push rather than discovered at release time.
      #
      # The count guard is not decoration. `basename dist/matra-*.whl`
      # with two matches becomes `basename A B`, where B is read as a
      # suffix to strip rather than a second file, so the tag case below
      # would inspect only the first wheel and pass with a non-abi3 one
      # sitting beside it. release.yml guards the same contract the
      # same way.
      - name: The wheel is abi3
        shell: bash
        run: |
          set -euo pipefail
          # find, not ls: shellcheck's SC2012 flags parsing ls, and with no
          # match find yields 0 and the guard below says so, where ls fails
          # with its own message instead.
          count=$(find dist -maxdepth 1 -name 'matra-*.whl' | wc -l | tr -d ' ')
          [ "$count" = "1" ] || { echo "::error::expected 1 wheel, got $count"; exit 1; }
          name=$(basename dist/matra-*.whl)
          echo "built $name"
          case "$name" in
            *-cp312-abi3-*) ;;
            *) echo "::error::$name is not an abi3 wheel"; exit 1 ;;
          esac
      - name: Install and import
        shell: bash
        run: |
          uv pip install --system dist/matra-*.whl
          python -c "from matra import Matra; print('ok')"

  pytype:
    name: Python type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9  # master
        with:
          toolchain: stable
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5  # v2
      - name: Create venv (maturin develop requires VIRTUAL_ENV)
        run: python -m venv .venv
      - name: Install maturin + mypy in venv
        run: |
          . .venv/bin/activate
          python -m pip install --upgrade uv
          # No --system: install into the activated venv, where the
          # mypy step below runs. Newer uv treats --system literally.
          uv pip install maturin "mypy>=1.10" click rich
      - name: Build and install matra in venv (so the _core stub resolves)
        run: |
          . .venv/bin/activate
          maturin develop --features "python,udpipe"
      - name: mypy
        run: |
          . .venv/bin/activate
          python -m mypy
