name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the workflow level. Only the deploy job can write to
# Pages or mint an OIDC token; the build job, which downloads a tarball and
# runs cargo doc, carries neither.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Must support edition = "2024" in book.toml; 0.4.x does not.
  MDBOOK_VERSION: 0.5.3
  # Builds the SvelteKit site preview. Keep in step with BUN_VERSION in ci.yml.
  BUN_VERSION: 1.3.12
  BUN_SHA256: 11dc3ee11bc1695e149737c6ca3d5619302cf4346e6b8a6ec7988967ef01ddc5

jobs:
  build:
    name: Build mdbook + rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9  # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2

      # No mermaid: diagrams are hand-authored inline SVG, and the plugin's
      # install step would re-add the preprocessor entries book/book.toml
      # deliberately removed (restore instructions live in that file).
      - name: Install mdbook
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"

      - name: Build mdbook
        working-directory: book
        run: mdbook build

      # The SvelteKit site that replaces mdBook (EP-0012). Until the cut-over
      # it is built for inspection only: uploaded as the `site-preview`
      # artifact, never deployed. Built for the Pages base path, so serve it
      # under /matra to browse it.
      - name: Install bun
        run: |
          set -euo pipefail
          curl -sSLf -o "$RUNNER_TEMP/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q -j "$RUNNER_TEMP/bun.zip" bun-linux-x64/bun -d "$HOME/.local/bin"

      - name: Build the SvelteKit site preview
        working-directory: site
        env:
          BASE_PATH: /matra
          # Comments (giscus) render only when both ids are set; see
          # site/README.md. The category id is set once the Docs discussion
          # category exists.
          PUBLIC_GISCUS_REPO_ID: R_kgDORzS1lQ
          PUBLIC_GISCUS_CATEGORY_ID: ""
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Upload the site preview
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: site-preview
          path: site/build
          if-no-files-found: error
          retention-days: 14

      - name: Build rustdoc
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --no-deps --all-features

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r book/book/* _site/
          mkdir -p _site/api
          cp -r target/doc/* _site/api/
          # Landing page for /api/ that redirects to the crate's index.
          cat > _site/api/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>matra API reference</title>
          <meta http-equiv="refresh" content="0; url=matra/index.html">
          <link rel="canonical" href="matra/index.html">
          <p>Redirecting to <a href="matra/index.html">matra API reference</a>.</p>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
