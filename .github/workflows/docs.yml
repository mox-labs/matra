name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the workflow level. Only the deploy job can write to
# Pages or mint an OIDC token; the build job, which downloads a tarball and
# runs cargo doc, carries neither.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Must support edition = "2024" in book.toml; 0.4.x does not.
  MDBOOK_VERSION: 0.5.3

jobs:
  build:
    name: Build mdbook + rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2

      # No mermaid: diagrams are hand-authored inline SVG, and the plugin's
      # install step would re-add the preprocessor entries book/book.toml
      # deliberately removed (restore instructions live in that file).
      - name: Install mdbook
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"

      - name: Build mdbook
        working-directory: book
        run: mdbook build

      - name: Build rustdoc
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --no-deps --all-features

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r book/book/* _site/
          mkdir -p _site/api
          cp -r target/doc/* _site/api/
          # Landing page for /api/ that redirects to the crate's index.
          cat > _site/api/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>matra API reference</title>
          <meta http-equiv="refresh" content="0; url=matra/index.html">
          <link rel="canonical" href="matra/index.html">
          <p>Redirecting to <a href="matra/index.html">matra API reference</a>.</p>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
