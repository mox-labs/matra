name: Scorecard

# OpenSSF Scorecard analyzes the repo against ~18 supply-chain best
# practices (branch protection, dependency pinning, signed releases, etc.)
# and uploads the results to the Security tab as SARIF. Public score is
# visible at https://scorecard.dev/viewer/?uri=github.com/mox-labs/matra.
#
# Adopted as part of i9/gh-guard-uptake. See docs/decisions/0005-supply-chain-hardening.md.

on:
  branch_protection_rule:
  schedule:
    - cron: "30 6 * * 1"   # Mondays 06:30 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # to upload SARIF
      id-token: write          # publish results to OpenSSF (publish_results)
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to Security tab
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4
        with:
          sarif_file: results.sarif
