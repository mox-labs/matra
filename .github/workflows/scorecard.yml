name: Scorecard

# OpenSSF Scorecard analyzes the repo against ~18 supply-chain best
# practices (branch protection, dependency pinning, signed releases, etc.)
# and uploads the results to the Security tab as SARIF. Public score is
# visible at https://scorecard.dev/viewer/?uri=github.com/mox-labs/matra.
#
# Adopted with the gh-guard hardening. See blueprints/legacy/rfcs/0005-supply-chain-hardening.md.

on:
  branch_protection_rule:
  schedule:
    - cron: "30 6 * * 1"   # Mondays 06:30 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # to upload SARIF
      id-token: write          # publish results to OpenSSF (publish_results)
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
        with:
          sarif_file: results.sarif
