name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@3f854a8fb5146b39d5cbf8b57f70d80810e1366f  # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The code-review plugin is the posting harness (it owns the
          # comment/inline-finding mechanics); the repo's pr-review
          # skill supplies the criteria. A skill-only prompt was tried
          # first and the review had no way to post (15 tool denials).
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # track_progress creates the tracking comment that
          # update_claude_comment writes the review into. Without it,
          # agent mode has no comment to update and the verdict is lost.
          track_progress: true
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Review criteria: this repository defines its own review
            gates in .claude/skills/pr-review/SKILL.md (boundary rules
            with grep-blind spellings, pipeline laws L1-L7, the structure-over-interpretation
            discipline, FFI exposure criterion, security gate, pit of
            success). Load that skill and apply its gates as the
            primary criteria; generic review heuristics are secondary.
            Findings must name the gate they violate.
          # The two MCP tools are the posting channel: in agent mode the
          # action only installs the comment servers when these names are
          # explicitly allowed (install-mcp-server.ts), which is why the
          # first live runs finished green with verdicts and nowhere to
          # put them (43 turns, 19 denials, zero comments on PR #43).
          claude_args: '--model claude-fable-5 --allowedTools "mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment,Bash(cargo test:*),Bash(cargo check:*),Bash(cargo fmt --check),Bash(./scripts/check-boundaries.sh)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md

