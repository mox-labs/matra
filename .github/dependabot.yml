version: 2

updates:
  # Rust dependencies (Cargo.toml, Cargo.lock).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - "area:deps"
      - "type:chore"
    groups:
      # Group minor + patch updates into a single PR to reduce noise.
      # Major version bumps still open their own PRs (reviewed individually).
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
      include: scope

  # GitHub Actions workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - "area:ci"
      - "type:chore"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(ci)"

  # Python dependencies in pyproject.toml.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - "area:python"
      - "type:chore"
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"

  # The docsite's JavaScript toolchain (site/package.json, site/bun.lock).
  # Every version is pinned exactly; Dependabot moves the pins. The Bun
  # binary itself is pinned by version and checksum in ci.yml and docs.yml,
  # which Dependabot does not track.
  - package-ecosystem: bun
    directory: "/site"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - "area:docs"
      - "type:chore"
    groups:
      site-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
      include: scope
