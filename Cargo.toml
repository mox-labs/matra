[package]
name = "matra"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["mox labs <yza.v@moxlabs.org>"]
license = "MIT"
description = "NLP library: UDPipe structured parse, base text metrics, summarization, keyphrase extraction. Rust core with Python bindings."
repository = "https://github.com/mox-labs/matra"
homepage = "https://mox-labs.github.io/matra/"
documentation = "https://docs.rs/matra"
readme = "README.md"
keywords = ["nlp", "udpipe", "parsing", "summarization", "readability"]
categories = ["text-processing", "science"]
# An exclude list, so anything not named here ships. `skills/matra/**` must
# keep shipping: it is the agent-facing skill, and the crate is where it is
# distributed from. Adding it here would remove public surface, not weight.
exclude = ["scratch/*", ".claude/*", "target/*", "book/*", "*.udpipe"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "matra"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "matra"
path = "src/bin/matra.rs"
required-features = ["cli"]

[dependencies]
# abi3-py312 builds against the stable ABI, so one wheel per platform
# covers CPython 3.12 and every later 3.x. Without it the wheel is tagged
# cp312 and pip on 3.13 or 3.14 falls through to a source build (ADR-0014).
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"], optional = true }
pythonize = { version = "0.29", optional = true }
udpipe-rs = { version = "0.2", optional = true }
sha2 = { version = "0.10", optional = true }
safetensors = { version = "0.8.0", optional = true }
# default-features = false drops the C regex engine (onig) and the C++
# suffix-array path; unstable_wasm keeps the closure pure Rust so the
# wasm32 target stays open (ADR-0010). The swapped regex engine is not
# on the code path for WordPiece tokenizers, which is what the
# model2vec adapter loads.
tokenizers = { version = "0.23.2", default-features = false, features = ["unstable_wasm"], optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
brotli = "7"
clap = { version = "4", features = ["derive"], optional = true }
clap_complete = { version = "4", optional = true }
serde_json = { version = "1", optional = true }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

# The pinned-download client, already in the tree because udpipe-rs pulls
# it. Declared under a target predicate so `model2vec` on wasm32 keeps the
# pure-Rust, no-network closure ADR-0010 asks for: the download half of the
# embedding adapter is `model2vec` plus `not(target_arch = "wasm32")`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.3", optional = true }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
assert_cmd = "2"
predicates = "3"

[features]
default = ["udpipe"]
udpipe = ["dep:udpipe-rs", "dep:sha2"]
model2vec = ["dep:safetensors", "dep:tokenizers", "dep:serde_json", "dep:sha2", "dep:ureq"]
python = ["dep:pyo3", "dep:pythonize", "cli"]
cli = ["dep:clap", "dep:clap_complete", "dep:serde_json", "udpipe"]

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "warn"

[lints.clippy]
# Targeted pedantic lints that catch real issues without being noisy.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[[example]]
name = "basic"
required-features = ["udpipe"]

[[example]]
name = "parse_once_use_many"
required-features = ["udpipe"]

[[example]]
name = "corpus"
required-features = ["udpipe"]
