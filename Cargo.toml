[package]
name = "vaani"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
authors = ["yzavyas <yza.vyas@gmail.com>"]
license = "MIT"
description = "NLP library: UDPipe structured parse, base text metrics, summarization, keyphrase extraction. Rust core with Python bindings."
repository = "https://github.com/mox-labs/vaani"
homepage = "https://mox-labs.github.io/vaani/"
documentation = "https://docs.rs/vaani"
readme = "README.md"
keywords = ["nlp", "udpipe", "parsing", "summarization", "readability"]
categories = ["text-processing", "science"]
exclude = ["scratch/*", ".claude/*", "target/*", "book/*", "*.udpipe"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "vaani"
crate-type = ["rlib", "cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"], optional = true }
pythonize = { version = "0.28", optional = true }
udpipe-rs = { version = "0.2", optional = true }
sha2 = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
brotli = "7"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[features]
default = ["udpipe"]
udpipe = ["udpipe-rs", "sha2"]
python = ["pyo3", "pythonize"]

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "warn"

[lints.clippy]
# Targeted pedantic lints that catch real issues without being noisy.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[[example]]
name = "basic"
required-features = ["udpipe"]

[[example]]
name = "parse_once_use_many"
required-features = ["udpipe"]

[[example]]
name = "corpus"
required-features = ["udpipe"]
