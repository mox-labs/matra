[package]
name = "vaani"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["yzavyas <yza.vyas@gmail.com>"]
license = "MIT"
description = "Prose metrics engine. Text in, structured analysis out."
repository = "https://github.com/mox-labs/vaani"
keywords = ["nlp", "prose", "readability", "metrics", "analysis"]
categories = ["text-processing"]
exclude = ["scratch/*", ".claude/*", "target/*", "*.udpipe"]

[lib]
name = "vaani"
crate-type = ["rlib", "cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"], optional = true }
pythonize = { version = "0.28", optional = true }
udpipe-rs = { version = "0.2", optional = true }
sha2 = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive"] }
brotli = "7"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[features]
default = ["udpipe"]
udpipe = ["udpipe-rs", "sha2"]
python = ["pyo3", "pythonize"]

[[example]]
name = "basic"
required-features = ["udpipe"]
