[package]
name = "matra"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
authors = ["mox labs <yza.v@moxlabs.org>"]
license = "MIT"
description = "NLP library: UDPipe structured parse, base text metrics, summarization, keyphrase extraction. Rust core with Python bindings."
repository = "https://github.com/mox-labs/matra"
homepage = "https://mox-labs.github.io/matra/"
documentation = "https://docs.rs/matra"
readme = "README.md"
keywords = ["nlp", "udpipe", "parsing", "summarization", "readability"]
categories = ["text-processing", "science"]
# An exclude list, so anything not named here ships. `blueprints/` is the
# design record (RFCs and EPs) and is for contributors, not crate users. `skills/matra/**` must
# keep shipping: it is the agent-facing skill, and the crate is where it is
# distributed from. Adding it here would remove public surface, not weight.
# `site/` is the docsite, its pages under `site/content/`.
# `tests/cited_figures.rs` and `tests/error_tables.rs` read `site/content/`,
# which does not ship, so either would fail every `cargo test` run from the
# published tarball. A new test that reads `site/` belongs on this list too,
# and so do `examples/docsite_figures.rs`, which generates the docsite's
# figure data from `site/inputs/`, and `examples/docsite_examples.rs`, which
# compiles the docsite's worked examples from `site/examples/`.
exclude = [
    "scratch/*",
    ".claude/*",
    "target/*",
    "site/*",
    "blueprints/*",
    "*.udpipe",
    "tests/cited_figures.rs",
    "tests/error_tables.rs",
    "examples/docsite_figures.rs",
    "examples/docsite_examples.rs",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "matra"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "matra"
path = "src/bin/matra.rs"
required-features = ["cli"]

[dependencies]
# abi3-py312 builds against the stable ABI, so one wheel per platform
# covers CPython 3.12 and every later GIL-enabled 3.x. Without it the wheel
# is tagged cp312 and pip on 3.13 or 3.14 falls through to a source build.
# Free-threaded builds take a different ABI tag (RFC-0014).
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"], optional = true }
pythonize = { version = "0.29", optional = true }
udpipe-rs = { version = "0.2", optional = true }
# Required, not behind a feature: every document records the SHA-256 of
# its input in its provenance (EPR-0006), and both model adapters verify
# their pins with it. Pure Rust, so the wasm32 closure stays open.
sha2 = "0.11"
safetensors = { version = "0.8.0", optional = true }
# default-features = false drops the C regex engine (onig) and the C++
# suffix-array path; unstable_wasm keeps the closure pure Rust so the
# wasm32 target stays open (RFC-0010). The swapped regex engine is not
# on the code path for WordPiece tokenizers, which is what the
# model2vec adapter loads.
tokenizers = { version = "0.23.2", default-features = false, features = ["unstable_wasm"], optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
brotli = "9"
clap = { version = "4", features = ["derive"], optional = true }
clap_complete = { version = "4", optional = true }
# Required, not behind a feature: `Format::Blocks` is a JSON input format
# (EPR-0006), read by the blocks reader in every build.
serde_json = "1"
# The markdown reader (EPR-0006). A CommonMark parser that reports the
# source range of every event, which is what gives each block its span.
# default-features = false drops the HTML renderer and the getopts
# binary; only the pull parser is used.
pulldown-cmark = { version = "0.13", default-features = false }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

# The pinned-download client. Both provisioning adapters fetch through it
# directly, so both size caps, both timeout budgets and both transport
# error classifications live in matra rather than in a dependency
# (RFC-0015). Declared under a target predicate so `model2vec` on wasm32
# keeps the pure-Rust, no-network closure RFC-0010 asks for: the download
# half of the embedding adapter is `model2vec` plus
# `not(target_arch = "wasm32")`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.3", optional = true }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
assert_cmd = "2"
predicates = "3"
jsonschema = { version = "0.60.2", default-features = false }

[features]
default = ["udpipe"]
udpipe = ["dep:udpipe-rs", "dep:ureq"]
model2vec = ["dep:safetensors", "dep:tokenizers", "dep:ureq"]
python = ["dep:pyo3", "dep:pythonize", "cli"]
# `serde_json/preserve_order` keeps a JSON object's keys in the order they
# were inserted (indexmap), where the default sorts them. The command line
# builds JSON through `serde_json::Value` in three places, `analyze
# --depth`, `config show --json` and `--schema --json`, and each should
# read in the order of the type, the listing or the file it came from.
# Without it `--depth sentence` ordered keys differently from the whole
# document, which made the two hard to diff.
cli = ["dep:clap", "dep:clap_complete", "udpipe", "serde_json/preserve_order"]

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "warn"

[lints.clippy]
# Targeted pedantic lints that catch real issues without being noisy.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[[example]]
name = "basic"
required-features = ["udpipe"]

[[example]]
name = "parse_once_use_many"
required-features = ["udpipe"]

[[example]]
name = "corpus"
required-features = ["udpipe"]

# Writes the docsite's figure data (EP-0012); excluded from the package above.
[[example]]
name = "docsite_figures"
required-features = ["udpipe"]

# Runs the docsite's worked examples' Rust calls (EP-0012); excluded from the
# package above.
[[example]]
name = "docsite_examples"
required-features = ["udpipe"]
